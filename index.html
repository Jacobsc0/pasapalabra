<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pasapalabra Online</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:1rem}
.header{text-align:center;margin-bottom:1.25rem}
.header h1{font-size:22px;font-weight:500;letter-spacing:3px;color:#1a1a1a}
.header .sub{font-size:13px;color:#888;margin-top:4px}
.scoreboard{display:flex;gap:12px;justify-content:center;margin-bottom:1.25rem}
.player-card{flex:1;max-width:220px;background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:12px 16px;text-align:center;transition:border .2s}
.player-card.active{border:2px solid #3b82f6}
.player-card.me-card{background:#eff6ff}
.player-name{font-size:14px;font-weight:500;color:#1a1a1a}
.player-score{font-size:28px;font-weight:500;color:#3b82f6}
.player-meta{font-size:11px;color:#999;margin-top:2px}
.rosco-container{position:relative;width:320px;height:320px;margin:0 auto 1.25rem}
.rosco-svg{width:100%;height:100%}
.center-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;text-align:center;pointer-events:none}
.timer-display{font-size:30px;font-weight:500;color:#1a1a1a;font-variant-numeric:tabular-nums}
.timer-warn{color:#ef4444!important}
.timer-label{font-size:11px;color:#999}
.cur-letter-badge{display:inline-block;background:#eff6ff;color:#3b82f6;font-size:20px;font-weight:500;width:40px;height:40px;line-height:40px;border-radius:50%;margin-bottom:4px}
.status-bar{display:flex;gap:10px;justify-content:center;font-size:12px;color:#888;margin-bottom:1rem;flex-wrap:wrap}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.q-panel{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.75rem;min-height:80px}
.q-label{font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.q-text{font-size:15px;color:#1a1a1a;line-height:1.5}
.q-hint{font-size:12px;color:#888;margin-top:6px}
.fb{border-radius:8px;padding:8px 12px;margin-bottom:.75rem;font-size:13px;display:none;align-items:center;gap:8px}
.fb.correct{background:#f0fdf4;border:.5px solid #86efac;color:#166534;display:flex}
.fb.wrong{background:#fef2f2;border:.5px solid #fca5a5;color:#991b1b;display:flex}
.fb.passed{background:#fffbeb;border:.5px solid #fcd34d;color:#92400e;display:flex}
.ans-row{display:flex;gap:8px;margin-bottom:.75rem}
.ans-row input{flex:1;height:40px;padding:0 12px;border-radius:8px;border:.5px solid #bbb;background:#fff;color:#1a1a1a;font-size:15px}
.ans-row input:focus{outline:none;border-color:#3b82f6}
.ans-row input:disabled{background:#f5f4f0;color:#999}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:1rem}
button{padding:8px 16px;border-radius:8px;border:.5px solid #bbb;background:transparent;color:#1a1a1a;font-size:13px;cursor:pointer;transition:background .15s}
button:hover{background:#eee}
button:disabled{opacity:.4;cursor:default}
button.primary{background:#3b82f6;color:#fff;border-color:transparent}
button.primary:hover{background:#2563eb}
button.danger{color:#dc2626;border-color:#fca5a5}
button.warn-btn{color:#d97706;border-color:#fcd34d}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.box{background:#fff;border-radius:16px;border:.5px solid #ddd;padding:2rem;text-align:center;max-width:400px;width:100%;max-height:90vh;overflow-y:auto}
.box h2{font-size:22px;font-weight:500;margin-bottom:.5rem;color:#1a1a1a}
.box p{color:#888;font-size:14px;margin-bottom:1.25rem}
.box input{width:100%;height:40px;padding:0 12px;margin-bottom:10px;border-radius:8px;border:.5px solid #bbb;background:#f5f4f0;color:#1a1a1a;font-size:15px}
.room-code{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:1rem;margin:1rem 0;letter-spacing:4px;font-size:28px;font-weight:500;color:#1d4ed8}
.waiting-dots::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}100%{content:''}}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;font-size:12px;padding:3px 10px;margin-bottom:.75rem}
.badge.online{background:#f0fdf4;color:#166534;border:.5px solid #86efac}
.badge.offline{background:#fef2f2;color:#991b1b;border:.5px solid #fca5a5}
.bdot{width:6px;height:6px;border-radius:50%}
.badge.online .bdot{background:#22c55e}
.badge.offline .bdot{background:#ef4444}
.spec-bar{background:#fffbeb;border:.5px solid #fcd34d;border-radius:8px;padding:8px 12px;font-size:13px;color:#92400e;text-align:center;margin-bottom:.75rem}
.tab-row{display:flex;border-bottom:.5px solid #eee;margin-bottom:1rem}
.tab-btn{flex:1;padding:8px;font-size:13px;background:transparent;border:none;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-.5px}
.tab-btn.active{color:#3b82f6;border-bottom-color:#3b82f6}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;text-align:left;margin:1rem 0}
.res-row{background:#f5f4f0;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.res-row .rl{font-size:16px;font-weight:500;flex-shrink:0;width:22px}
.res-row .ri{flex:1;min-width:0}
.res-row .ra{font-size:11px;color:#888;word-break:break-word}
.res-row.cr{background:#f0fdf4}
.res-row.wr{background:#fef2f2}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid #eee;font-size:14px}
.sum-row:last-child{border-bottom:none}
.time-picker{display:flex;gap:8px;justify-content:center;margin-bottom:1rem}
</style>
</head>
<body>
<div id="app">

<div id="lobby">
  <div class="overlay"><div class="box">
    <h2>Pasapalabra Online</h2>
    <p>Juega con tu pareja en tiempo real 💛</p>
    <div id="conn-badge" class="badge offline"><div class="bdot"></div> Conectando...</div>
    <input id="my-name" placeholder="Tu nombre" maxlength="20"/>
    <div style="display:flex;gap:10px;margin-bottom:.5rem">
      <button class="primary" onclick="createRoom()" id="btn-create" style="flex:1;padding:12px" disabled>Crear sala</button>
      <button onclick="showJoin()" id="btn-join-show" style="flex:1;padding:12px" disabled>Unirse</button>
    </div>
    <div id="join-area" style="display:none;margin-top:10px">
      <input id="code-input" placeholder="Codigo de sala (4 letras)" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;font-size:18px;text-align:center"/>
      <button class="primary" onclick="joinRoom()" style="width:100%;padding:10px;margin-top:6px">Entrar</button>
    </div>
    <div id="lobby-msg" style="font-size:13px;color:#e00;margin-top:10px"></div>
  </div></div>
</div>

<div id="waiting" style="display:none">
  <div class="overlay"><div class="box">
    <h2>Sala creada ✅</h2>
    <p>Comparte este codigo con tu novia</p>
    <div class="room-code" id="room-code-display">----</div>
    <p style="font-size:13px;color:#888">Esperando al otro jugador<span class="waiting-dots"></span></p>
    <div style="margin-top:1rem">
      <label style="font-size:13px;color:#888;display:block;margin-bottom:6px">Tiempo por ronda</label>
      <div class="time-picker">
        <button id="t60" class="primary" onclick="selectTime(60)">60 seg</button>
        <button id="t90" onclick="selectTime(90)">90 seg</button>
        <button id="t120" onclick="selectTime(120)">120 seg</button>
      </div>
    </div>
    <button onclick="cancelRoom()" class="danger" style="margin-top:1rem;width:100%">Cancelar</button>
  </div></div>
</div>

<div id="game" style="display:none">
  <div class="header"><h1>PASAPALABRA</h1><div class="sub" id="turn-label">-</div></div>
  <div style="display:flex;justify-content:center">
    <div id="game-badge" class="badge online"><div class="bdot"></div> Online</div>
  </div>
  <div class="scoreboard">
    <div class="player-card" id="card-0"><div class="player-name" id="name-0">-</div><div class="player-score" id="score-0">0</div><div class="player-meta" id="meta-0">-</div></div>
    <div class="player-card" id="card-1"><div class="player-name" id="name-1">-</div><div class="player-score" id="score-1">0</div><div class="player-meta" id="meta-1">-</div></div>
  </div>
  <div class="rosco-container">
    <svg class="rosco-svg" viewBox="0 0 320 320" id="rosco-svg"></svg>
    <div class="center-panel">
      <div class="cur-letter-badge" id="cur-letter">?</div>
      <div class="timer-display" id="timer">-</div>
      <div class="timer-label">segundos</div>
    </div>
  </div>
  <div class="status-bar">
    <span><span class="sdot" style="background:#22c55e"></span>Correcta</span>
    <span><span class="sdot" style="background:#ef4444"></span>Incorrecta</span>
    <span><span class="sdot" style="background:#f59e0b"></span>Pasada</span>
    <span><span class="sdot" style="background:#ccc"></span>Pendiente</span>
  </div>
  <div id="spec-bar" class="spec-bar" style="display:none">Turno de <span id="spec-name"></span> — espera tu turno</div>
  <div class="q-panel">
    <div class="q-label">Pregunta</div>
    <div class="q-text" id="q-text">-</div>
    <div class="q-hint" id="q-hint"></div>
  </div>
  <div class="fb" id="fb"><span id="fb-text"></span></div>
  <div class="ans-row">
    <input id="ans-input" placeholder="Tu respuesta..." onkeydown="if(event.key==='Enter')checkAnswer()" disabled/>
    <button class="primary" onclick="checkAnswer()" id="btn-ok" disabled>OK</button>
  </div>
  <div class="btn-row">
    <button class="warn-btn" onclick="passLetter()" id="btn-pass" disabled>Pasapalabra</button>
    <button class="danger" onclick="wrongAnswer()" id="btn-wrong" disabled>Incorrecta</button>
    <button onclick="endTurn()" id="btn-end" disabled>Terminar turno</button>
  </div>
</div>

<div id="results" style="display:none">
  <div class="overlay"><div class="box">
    <h2 id="winner-title">Fin!</h2>
    <p id="winner-sub"></p>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-summary" onclick="showTab('summary')">Resumen</button>
      <button class="tab-btn" id="tab-p0" onclick="showTab('p0')">P1</button>
      <button class="tab-btn" id="tab-p1" onclick="showTab('p1')">P2</button>
    </div>
    <div id="tc-summary"></div>
    <div id="tc-p0" style="display:none"></div>
    <div id="tc-p1" style="display:none"></div>
    <button class="primary" onclick="location.reload()" style="width:100%;padding:12px;font-size:15px;margin-top:1rem">Jugar de nuevo</button>
  </div></div>
</div>

</div>

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function buildQ(){
  const q={};
  LETTERS.forEach(l=>{ q[l]=pick(BANK[l]); });
  return q;
}
function norm(s){
  return s.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function randCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s='';for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)];
  return s;
}

let myId='u'+Math.random().toString(36).slice(2,9);
let myRole=null, myIdx=0, roomCode=null, roomRef=null, listener=null;
let timerInterval=null, lastData=null, busy=false;

// Connection status
window.addEventListener('load',()=>{
  const cr=ref(db,'.info/connected');
  onValue(cr,snap=>{
    const online=!!snap.val();
    const b=document.getElementById('conn-badge');
    if(b){ b.className='badge '+(online?'online':'offline'); b.innerHTML='<div class="bdot"></div> '+(online?'Conectado':'Sin conexion'); }
    ['btn-create','btn-join-show'].forEach(id=>{ const el=document.getElementById(id); if(el) el.disabled=!online; });
  });
});

window.showJoin=function(){
  const ja=document.getElementById('join-area');
  ja.style.display=ja.style.display==='none'?'block':'none';
};
window.selectTime=function(t){
  ['t60','t90','t120'].forEach(id=>{ const el=document.getElementById(id); if(el) el.className=(id==='t'+t)?'primary':''; });
  if(roomRef&&myRole==='host') update(roomRef,{timerMax:t});
};
window.cancelRoom=function(){ if(roomRef) remove(roomRef); location.reload(); };

window.createRoom=function(){
  const name=document.getElementById('my-name').value.trim()||'Jugador 1';
  myRole='host'; myIdx=0; roomCode=randCode();
  const qs=buildQ(), ls={};
  LETTERS.forEach(l=>{ ls[l]='pending'; });
  roomRef=ref(db,'rooms/'+roomCode);
  set(roomRef,{
    host:{id:myId,name,score:0,correct:0,wrong:0,passed:0,letters:{}},
    guest:null, status:'waiting', currentTurn:0,
    timerMax:60, timerStart:null, timerRunning:false,
    letterStates:ls, activeIdx:null, questions:qs,
    lastAction:{type:'none',answer:'',player:-1},
  }).then(()=>{
    document.getElementById('lobby').style.display='none';
    document.getElementById('waiting').style.display='block';
    document.getElementById('room-code-display').textContent=roomCode;
    listenRoom();
  }).catch(e=>msg('Error: '+e.message));
};

window.joinRoom=function(){
  const name=document.getElementById('my-name').value.trim()||'Jugador 2';
  const code=document.getElementById('code-input').value.trim().toUpperCase();
  if(code.length!==4){msg('El codigo debe tener 4 letras');return;}
  myRole='guest'; myIdx=1; roomCode=code;
  roomRef=ref(db,'rooms/'+roomCode);
  get(roomRef).then(snap=>{
    if(!snap.exists()){msg('Sala no encontrada');return;}
    const d=snap.val();
    if(d.status!=='waiting'){msg('La sala ya esta en juego');return;}
    if(d.guest){msg('La sala ya esta llena');return;}
    update(roomRef,{
      guest:{id:myId,name,score:0,correct:0,wrong:0,passed:0,letters:{}},
      status:'playing',
    }).then(()=>{
      document.getElementById('lobby').style.display='none';
      document.getElementById('game').style.display='block';
      listenRoom();
    });
  }).catch(e=>msg('Error: '+e.message));
};

function msg(m){ document.getElementById('lobby-msg').textContent=m; }

function listenRoom(){
  if(listener) off(roomRef,'value',listener);
  listener=onValue(roomRef,snap=>{
    if(!snap.exists()){location.reload();return;}
    const data=snap.val(); lastData=data;
    if(data.status==='playing'&&myRole==='host'){
      document.getElementById('waiting').style.display='none';
      document.getElementById('game').style.display='block';
    }
    if(data.status==='finished'){ clearInterval(timerInterval); showResults(data); return; }
    if(data.status==='playing'){ renderGame(data); }
  });
}

// Timer: local countdown synced to Firebase timerStart
function syncTimer(data){
  clearInterval(timerInterval);
  const el=document.getElementById('timer');
  if(!data.timerRunning||!data.timerStart){
    el.textContent=data.timerMax||60; el.className='timer-display'; return;
  }
  function tick(){
    if(!lastData||!lastData.timerRunning){ clearInterval(timerInterval); return; }
    const elapsed=Math.floor((Date.now()-lastData.timerStart)/1000);
    const rem=Math.max(0,(lastData.timerMax||60)-elapsed);
    el.textContent=rem;
    el.className=rem<=10?'timer-display timer-warn':'timer-display';
    if(rem<=0){ clearInterval(timerInterval); if(isMine()) endTurn(); }
  }
  tick(); timerInterval=setInterval(tick,500);
}

function renderGame(data){
  if(!data.host||!data.guest) return;
  const pl=[data.host,data.guest];

  // Scores & cards
  [0,1].forEach(i=>{
    document.getElementById('name-'+i).textContent=pl[i].name;
    document.getElementById('score-'+i).textContent=pl[i].score||0;
    document.getElementById('meta-'+i).textContent=(pl[i].correct||0)+' correctas · '+(pl[i].passed||0)+' pasadas';
    document.getElementById('card-'+i).className='player-card'+(i===data.currentTurn?' active':'')+(i===myIdx?' me-card':'');
  });
  document.getElementById('tab-p0').textContent=pl[0].name;
  document.getElementById('tab-p1').textContent=pl[1].name;

  const mine=isMine();
  document.getElementById('turn-label').textContent=mine?'¡Tu turno!':'Turno de '+pl[data.currentTurn].name;
  document.getElementById('spec-bar').style.display=mine?'none':'block';
  document.getElementById('spec-name').textContent=pl[data.currentTurn].name;

  // Rosco
  if(!document.getElementById('circle-A')) drawRosco();
  LETTERS.forEach(l=>updateLetter(l,data));

  // Active letter
  const ai=data.activeIdx;
  const al=(ai!==null&&ai!==undefined)?LETTERS[ai]:null;
  document.getElementById('cur-letter').textContent=al||'?';

  // Question — from Firebase, same for both players
  if(al&&data.questions&&data.questions[al]){
    const q=data.questions[al];
    document.getElementById('q-text').textContent=q.q;
    document.getElementById('q-hint').textContent='Respuesta empieza con la letra '+al;
  } else {
    document.getElementById('q-text').textContent=mine?'Haz clic en una letra para empezar':'Esperando al otro jugador...';
    document.getElementById('q-hint').textContent='';
  }

  // Feedback — both see it
  const la=data.lastAction;
  const fb=document.getElementById('fb');
  const ft=document.getElementById('fb-text');
  if(la&&la.type==='correct'){ fb.className='fb correct'; ft.textContent='Correcto! Respuesta: '+la.answer; }
  else if(la&&la.type==='wrong'){ fb.className='fb wrong'; ft.textContent='Incorrecto. La respuesta era: '+la.answer; }
  else if(la&&la.type==='passed'){ fb.className='fb passed'; ft.textContent='Pasapalabra'; }
  else { fb.className='fb'; }

  syncTimer(data);

  // Controls
  const canAct=mine&&al!==null&&!busy;
  document.getElementById('ans-input').disabled=!canAct;
  document.getElementById('btn-ok').disabled=!canAct;
  document.getElementById('btn-pass').disabled=!canAct;
  document.getElementById('btn-wrong').disabled=!canAct;
  document.getElementById('btn-end').disabled=!mine;
}

function isMine(){ return lastData&&lastData.currentTurn===myIdx; }
function myKey(){ return myRole==='host'?'host':'guest'; }

function drawRosco(){
  const svg=document.getElementById('rosco-svg');
  if(!svg) return;
  const cx=160,cy=160,r=138,n=LETTERS.length;
  svg.innerHTML='';
  LETTERS.forEach((l,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    const x=cx+r*Math.cos(angle),y=cy+r*Math.sin(angle);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor='pointer';
    g.addEventListener('click',()=>selectLetter(l));
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',17);
    c.setAttribute('id','circle-'+l);c.setAttribute('fill','#f5f4f0');c.setAttribute('stroke','#ccc');c.setAttribute('stroke-width',1.5);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y+5);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','12');t.setAttribute('font-weight','500');t.setAttribute('fill','#1a1a1a');
    t.setAttribute('id','text-'+l);t.textContent=l;
    g.appendChild(c);g.appendChild(t);svg.appendChild(g);
  });
}

const FILLS={correct:'#22c55e',wrong:'#ef4444',passed:'#f59e0b',active:'#3b82f6',pending:'#f5f4f0'};
const STROKES={correct:'#16a34a',wrong:'#dc2626',passed:'#d97706',active:'#2563eb',pending:'#ccc'};

function updateLetter(l,data){
  const ai=data.activeIdx;
  const isActive=(ai!==null&&ai!==undefined&&LETTERS[ai]===l);
  const s=isActive?'active':(data.letterStates[l]||'pending');
  const c=document.getElementById('circle-'+l);
  const t=document.getElementById('text-'+l);
  if(c){c.setAttribute('fill',FILLS[s]||FILLS.pending);c.setAttribute('stroke',STROKES[s]||STROKES.pending);}
  if(t){t.setAttribute('fill',['active','correct','wrong','passed'].includes(s)?'#fff':'#1a1a1a');}
}

window.selectLetter=function(l){
  if(!isMine()||busy) return;
  const ls=lastData.letterStates||{};
  if(ls[l]==='correct'||ls[l]==='wrong') return;
  document.getElementById('ans-input').value='';
  document.getElementById('ans-input').focus();
  const u={activeIdx:LETTERS.indexOf(l),lastAction:{type:'none',answer:'',player:myIdx}};
  if(!lastData.timerRunning){ u.timerRunning=true; u.timerStart=Date.now(); }
  update(roomRef,u);
};

window.checkAnswer=function(){
  if(!isMine()||busy) return;
  const ai=lastData.activeIdx;
  if(ai===null||ai===undefined) return;
  const l=LETTERS[ai];
  const inp=document.getElementById('ans-input');
  const input=norm(inp.value);
  if(!input) return;
  const q=lastData.questions[l];
  if(!q) return;
  const correct=(input===norm(q.ans)||(q.alt||[]).map(norm).includes(input));
  busy=true; inp.disabled=true;
  const pl=lastData[myKey()];
  const lc={...(pl.letters||{})}; lc[l]=correct?'correct':'wrong';
  update(roomRef,{
    [`${myKey()}/score`]:(pl.score||0)+(correct?1:0),
    [`${myKey()}/correct`]:(pl.correct||0)+(correct?1:0),
    [`${myKey()}/wrong`]:(pl.wrong||0)+(correct?0:1),
    [`${myKey()}/letters`]:lc,
    [`letterStates/${l}`]:correct?'correct':'wrong',
    lastAction:{type:correct?'correct':'wrong',answer:q.ans,player:myIdx},
    activeIdx:null,
  }).then(()=>setTimeout(()=>{ busy=false; inp.value=''; advanceLetter(); },1600));
};

window.passLetter=function(){
  if(!isMine()||busy) return;
  const ai=lastData.activeIdx;
  if(ai===null||ai===undefined) return;
  const l=LETTERS[ai];
  busy=true;
  const pl=lastData[myKey()];
  update(roomRef,{
    [`${myKey()}/passed`]:(pl.passed||0)+1,
    [`letterStates/${l}`]:'passed',
    lastAction:{type:'passed',answer:'',player:myIdx},
    activeIdx:null,
  }).then(()=>setTimeout(()=>{ busy=false; advanceLetter(); },600));
};

window.wrongAnswer=function(){
  if(!isMine()||busy) return;
  const ai=lastData.activeIdx;
  if(ai===null||ai===undefined) return;
  const l=LETTERS[ai];
  const q=lastData.questions[l];
  busy=true; document.getElementById('ans-input').disabled=true;
  const pl=lastData[myKey()];
  const lc={...(pl.letters||{})}; lc[l]='wrong';
  update(roomRef,{
    [`${myKey()}/wrong`]:(pl.wrong||0)+1,
    [`${myKey()}/letters`]:lc,
    [`letterStates/${l}`]:'wrong',
    lastAction:{type:'wrong',answer:q?q.ans:'?',player:myIdx},
    activeIdx:null,
  }).then(()=>setTimeout(()=>{ busy=false; advanceLetter(); },1600));
};

function advanceLetter(){
  if(!lastData) return;
  const ls=lastData.letterStates||{};
  const hasMore=LETTERS.some(l=>ls[l]!=='correct'&&ls[l]!=='wrong');
  if(!hasMore){ endGameDB(); return; }
  update(roomRef,{activeIdx:null,lastAction:{type:'none',answer:'',player:-1}});
}

window.endTurn=function(){
  if(!isMine()) return;
  clearInterval(timerInterval);
  const ls={...(lastData.letterStates||{})};
  LETTERS.forEach(l=>{ if(ls[l]==='passed') ls[l]='pending'; });
  update(roomRef,{
    currentTurn:1-lastData.currentTurn,
    timerRunning:false, timerStart:null,
    letterStates:ls, activeIdx:null,
    lastAction:{type:'none',answer:'',player:-1},
  });
};

function endGameDB(){ update(roomRef,{status:'finished'}); }

function showResults(data){
  document.getElementById('game').style.display='none';
  document.getElementById('results').style.display='block';
  const p=[data.host,data.guest];
  if(!p[0]||!p[1]) return;
  let title,sub;
  if((p[0].score||0)>(p[1].score||0)){title='🏆 '+p[0].name+' gana!';sub='Felicitaciones! 🎉';}
  else if((p[1].score||0)>(p[0].score||0)){title='🏆 '+p[1].name+' gana!';sub='Felicitaciones! 🎉';}
  else{title='Empate!';sub='Los dos jugaron increible 💪';}
  document.getElementById('winner-title').textContent=title;
  document.getElementById('winner-sub').textContent=sub;
  document.getElementById('tab-p0').textContent=p[0].name;
  document.getElementById('tab-p1').textContent=p[1].name;
  buildSummary(p);
  buildPlayerTab(0,p,data.questions);
  buildPlayerTab(1,p,data.questions);
  showTab('summary');
}

function buildSummary(p){
  let html='<div>';
  p.forEach(pl=>{
    if(!pl) return;
    html+=`<div class="sum-row"><span style="font-weight:500">${pl.name}</span><span>${pl.score||0} pts &nbsp; ${pl.correct||0} correctas &nbsp; ${pl.wrong||0} incorrectas</span></div>`;
  });
  document.getElementById('tc-summary').innerHTML=html+'</div>';
}

function buildPlayerTab(idx,p,qs){
  const pl=p[idx];
  if(!pl){document.getElementById('tc-p'+idx).innerHTML='';return;}
  let html='<div class="res-grid">';
  LETTERS.forEach(l=>{
    const st=(pl.letters&&pl.letters[l])||'pending';
    const q=qs&&qs[l];
    const lbl=st==='correct'?'✓':st==='wrong'?'✗':'—';
    const rc=st==='correct'?'cr':st==='wrong'?'wr':'';
    const qtxt=q?q.q.replace(/^Con la [A-Z]\. /,''):'';
    html+=`<div class="res-row ${rc}"><div class="rl">${lbl} ${l}</div><div class="ri"><div style="font-size:11px;color:#555">${qtxt}</div><div class="ra">${q?q.ans:''}</div></div></div>`;
  });
  document.getElementById('tc-p'+idx).innerHTML=html+'</div>';
}

window.showTab=function(tab){
  ['summary','p0','p1'].forEach(t=>{
    document.getElementById('tc-'+t).style.display=t===tab?'block':'none';
    document.getElementById('tab-'+t).className='tab-btn'+(t===tab?' active':'');
  });
};
